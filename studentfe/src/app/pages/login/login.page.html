<ion-content class="login-bg">

  <div class="login-container">

    <div class="brand">
      <img src="assets/stdicon.jpg" class="logo" />
      <h1>GenQuery-AI Powered Assistant</h1>
      <p>Student Portal</p>
    </div>

    <ion-card class="login-card">

      <ion-item>
        <ion-input
          name="username"
          placeholder="Username"
          [(ngModel)]="form.username">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          name="password"
          type="password"
          placeholder="Password"
          [(ngModel)]="form.password">
        </ion-input>
      </ion-item>

      <p class="error" *ngIf="errorMsg">{{errorMsg}}</p>

      <ion-button expand="block" class="login-btn" (click)="login()">
        Login
      </ion-button>
      <div class="register-line">
        <span>new to portal?</span>
        <a (click)="goSignup()">create your account ✨</a>
      </div>

    </ion-card>

  </div>

</ion-content>
