<ion-content class="signup-bg" scroll-y="true">

  <div class="signup-container">

    <!-- Brand -->
    <div class="brand">
      <img src="assets/stdicon.jpg" class="logo" />
      <h1>GenQuery-AI powered Assistant</h1>
      <p>Student Portal</p>
    </div>

    <!-- Form Card -->
    <ion-card class="signup-card">

      <ion-item>
        <ion-input name="first_name" placeholder="First Name" [(ngModel)]="form.first_name"></ion-input>
      </ion-item>

      <ion-item>
        <ion-input name="last_name" placeholder="Last Name" [(ngModel)]="form.last_name"></ion-input>
      </ion-item>

      <ion-item>
        <ion-input name="username" placeholder="Username" [(ngModel)]="form.username"></ion-input>
      </ion-item>

      <ion-item>
        <ion-input name="password" type="password" placeholder="Password" [(ngModel)]="form.password"></ion-input>
      </ion-item>

      <ion-item>
        <ion-input name="contact" placeholder="Contact" [(ngModel)]="form.contact"></ion-input>
      </ion-item>

      <ion-item>
        <ion-input name="course" placeholder="Course" [(ngModel)]="form.course"></ion-input>
      </ion-item>

      <ion-item>
        <ion-textarea name="address" placeholder="Address" autoGrow="true"
          [(ngModel)]="form.address">
        </ion-textarea>
      </ion-item>

      <ion-button expand="block" class="signup-btn" (click)="signup()">
        Create Account
      </ion-button>

    </ion-card>

  </div>

</ion-content>
